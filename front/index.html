<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style/style.css">
    <link rel="stylesheet" href="style/global.css">
    <title>Corrida dos Amigos</title>
</head>
<body>
    <header>
        <img src="pictures/ChatGPT Image 28 de set. de 2026, 20_07_33.png" alt="">
    </header>
    
    
    <!-- Card de Inscrição -->
    <section class="signup-card">
        <h3>INSCRIÇÃO</h3>
            
        <div class="options-container">
            <!-- Opção 1 -->
            <div class="option-box">
                <i class="fa-solid fa-shirt option-icon"></i>
                <span class="option-label">COM CAMISA</span>
                <span class="price">R$ 60,00</span>
            </div>

            <!-- Opção 2 -->
            <div class="option-box">
                <i class="fa-solid fa-shirt option-icon-outline"></i>
                <span class="option-label">SEM CAMISA</span>
                <span class="price">R$ 35,00</span>
            </div>
        </div>

        <button class="btn-submit">
            FAZER INSCRIÇÃO <i class="fa-solid fa-arrow-right"></i>
        </button>
    </section>
    
    <!-- Barra de Navegação Inferior -->
        <nav class="bottom-nav">
            <a href="#" class="nav-item active">
                <i class="fa-solid fa-house"></i>
                <span>Início</span>
            </a>
            <a href="#" class="nav-item">
                <i class="fa-regular fa-file-lines"></i>
                <span>Inscrição</span>
            </a>

            <a href="#" class="nav-item">
                <i class="fa-regular fa-circle-question"></i>
                <span>Suporte</span>
            </a>
        </nav>
    </div>
</body>
</html>
