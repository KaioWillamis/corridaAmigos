<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <section class="etapa1">
        <header class="cabecalho">
            <a href="index.html" class="voltar">←</a>
            <h1>Inscrição</h1>
        </header>

        <section class="progresso">
            <div class="etapa ativa">1</div>
            <div class="linha"></div>
            <div class="etapa">2</div>
            <div class="linha"></div>
            <div class="etapa">3</div>
            <div class="linha"></div>
            <div class="etapa">4</div>
            <div class="linha"></div>
            <div class="etapa">5</div>
        </section>

        <section class="dados-atleta">

            <h2>Dados do atleta</h2>

            <form>

                <div class="campo">
                    <label for="nome">Nome completo <span>*</span></label>
                    <input
                        type="text"
                        id="nome"
                        name="nome"
                        placeholder="Digite seu nome completo"
                        autocomplete="name"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="cpf">CPF <span>*</span></label>
                    <input
                        type="text"
                        id="cpf"
                        name="cpf"
                        placeholder="Digite seu CPF"
                        inputmode="numeric"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="nascimento">Data de nascimento <span>*</span></label>
                    <input
                        type="date"
                        id="nascimento"
                        name="nascimento"
                        required
                    >
                </div>

                <fieldset class="campo sexo">
                    <legend>Sexo <span>*</span></legend>

                    <label>
                        <input type="radio" name="sexo" value="masculino" required>
                        Masculino
                    </label>

                    <label>
                        <input type="radio" name="sexo" value="feminino">
                        Feminino
                    </label>
                </fieldset>

                <div class="campo">
                    <label for="email">E-mail <span>*</span></label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Digite seu e-mail"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="whatsapp">WhatsApp <span>*</span></label>
                    <input
                        type="tel"
                        id="whatsapp"
                        name="whatsapp"
                        placeholder="Digite seu WhatsApp"
                        autocomplete="tel"
                        required
                    >
                </div>

                <button type="button" class="btn-proximo">
                    Próximo →
                </button>

            </form>

        </section>
    </section>

    <section class="etapa2">

    </section>

    <section class="etapa3">

    </section>

    <section class="etapa4">

    </section>

    <section class="etapa5">

    </section>

    <section class="etapa6">

    </section>

    <section class="etapa7">

    </section>
</body>
</html>
